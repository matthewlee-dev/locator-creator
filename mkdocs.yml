site_name: Locator Creator
repo_url: https://github.com/matthewlee-dev/locator-creator
repo_name: matthewlee-dev/locator-creator
theme:
  name: material
  language: en
  # Setup swaps this file for the generated project's logo, so the path holds
  # for both.
  logo: resources/images/maya_python_logo.png
  favicon: resources/images/maya_python_logo.png
  palette:
    - scheme: slate
      primary: black
      accent: teal

plugins:
- search:
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        # Docs CI syncs only the docs group, so the project isn't installed.
        paths: [src]
        options:
          show_source: true

watch:
  - src

nav:
  - index.md
  - reference.md
