[project]
name = "locator-creator"
version = "0.0.0"
description = "This is a test repo for maya-python-project-template"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
test = ["pytest"]
# maya-stubs isn't used by CI; it gives editors cmds autocomplete/signatures.
dev = ["ruff", "maya-stubs"]
# mkdocs<2 pinned: 2.0 drops the plugin system, breaking mkdocs-material/mkdocstrings.
docs = ["mkdocs<2", "mkdocs-material", "mkdocstrings[python]"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locatorcreator"]
